name: 构建未签名 IPA（春风 150SC-F）

# 放在你 fork 的 CarWithin 仓库里，路径必须是 .github/workflows/build-unsigned-ipa.yml
# 然后 Actions → 左侧选这个 workflow → Run workflow。
# 默认直接构建「上游官方 main」，不依赖你有没有点过 Sync fork；产物是未签名 IPA，
# 需要你自己用 Sideloadly / ESign / AltStore 等签名后安装。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '可选：指定要构建的分支/标签（留空＝上游官方 main）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned arm64 IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 打印构建环境
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "swift: $(swift --version 2>&1 | head -n 1)"
          echo "runner: $(uname -m) / $(sw_vers -productVersion)"

      - name: 对齐到含春风输出的源码
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.ref }}" ]; then
            echo "使用指定 ref：${{ inputs.ref }}"
            git checkout --force "${{ inputs.ref }}"
          else
            # 直接构建上游官方 main，避免「fork 没同步 → 没有春风代码 → 白跑一次」
            git remote add upstream https://github.com/xmz28/CarWithin.git 2>/dev/null || \
              git remote set-url upstream https://github.com/xmz28/CarWithin.git
            git fetch --depth=1 upstream main
            git reset --hard FETCH_HEAD
          fi
          echo "commit: $(git rev-parse --short HEAD)  $(git log -1 --format=%s)"

      - name: 确认春风输出在源码里
        run: |
          set -euo pipefail
          missing=0
          test -f App/CfmotoOutput.swift || { echo "::error::缺少 App/CfmotoOutput.swift，源码太旧"; missing=1; }
          test -f App/PxcConnection.swift || { echo "::error::缺少 App/PxcConnection.swift"; missing=1; }
          grep -q 'sixInch' App/CfmotoOutput.swift || { echo "::error::CfmotoOutput 里没有 sixInch 档位"; missing=1; }
          grep -q 'cfmoto62' App/ReceiverViewController.swift || { echo "::error::输出菜单里没有春风 6.2 寸"; missing=1; }
          test "$missing" -eq 0
          echo "OK：春风 5 寸 / 6.2 寸输出已就位"

      - name: 注入 MFi 配件身份
        run: |
          set -euo pipefail
          # 公开源码不含 MFi 身份（certificate.p7b / leaf.cer / private.x963）。
          # 缺了它 App 能装能开，但 CarPlay 会话建立不了。
          # 优先用仓库里你自己放的；没有就从官方 v1.0.4 IPA 取同一套公开资源（含 SHA-256 校验）。
          if [ -s App/BundledIdentity/certificate.p7b ] && \
             [ -s App/BundledIdentity/leaf.cer ] && \
             [ -s App/BundledIdentity/private.x963 ]; then
            echo "使用仓库内自带的 App/BundledIdentity 身份"
          else
            IPA="$RUNNER_TEMP/official.ipa"
            curl -fL --retry 3 --retry-delay 2 -o "$IPA" \
              "https://github.com/xmz28/CarWithin/releases/download/v1.0.4/CarWithin-1.0.4-unsigned.ipa"
            echo "9dc990693f0a2141a8815bbf3b3a07a03c1423575ca533610100711f93f04ef9  $IPA" | shasum -a 256 -c -
            rm -rf "$RUNNER_TEMP/official" && mkdir -p "$RUNNER_TEMP/official"
            unzip -q "$IPA" -d "$RUNNER_TEMP/official"
            APP_DIR="$(find "$RUNNER_TEMP/official/Payload" -maxdepth 1 -name '*.app' | head -n 1)"
            test -n "$APP_DIR"
            mkdir -p App/BundledIdentity
            cp "$APP_DIR/certificate.p7b" "$APP_DIR/leaf.cer" "$APP_DIR/private.x963" App/BundledIdentity/
            rm -f "$IPA"
          fi
          ls -l App/BundledIdentity

      - name: 构建未签名 arm64 Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: 打包成 .ipa 并自检
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/TDSCarKit.app"
          test -d "$APP"

          echo "--- 版本 ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || true

          echo "--- MFi 身份 ---"
          for f in certificate.p7b leaf.cer private.x963; do
            test -s "$APP/$f" || { echo "::error::产物缺少 $f"; exit 1; }
            ls -l "$APP/$f"
          done

          echo "--- 架构 ---"
          lipo -info "$APP/TDSCarKit"

          echo "--- 春风代码特征（二进制字节计数）---"
          # 注意：Swift 会把 ≤15 字节的短字符串内联进指令，文件里没有连续 ASCII，
          # 所以不能用 easy_conn / pxcVersion 这类短串判断；改用类型元数据和长字面量。
          python3 -c "import sys;d=open(sys.argv[1],'rb').read();ks=[b'CfmotoOutput',b'CfmotoProfile',b'PxcConnection',b'appVersionFingerPrint'];h={k.decode():d.count(k) for k in ks};print('  '+', '.join(k+'='+str(v) for k,v in h.items()));sys.exit(0 if all(v>0 for v in h.values()) else 1)" "$APP/TDSCarKit" || {
            echo "::error::二进制里缺少春风代码特征，这份包没有春风输出"
            exit 1
          }
          echo "  ✓ 春风 PXC 代码已编入"

          echo "--- 打包 ---"
          rm -rf dist && mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          NAME="CarWithin-$(git rev-parse --short HEAD)-scf-unsigned.ipa"
          ( cd dist && zip -qry "$NAME" Payload )
          shasum -a 256 "dist/$NAME" | tee dist/SHA256SUMS

          {
            echo "repo:   $(git remote get-url origin)"
            echo "commit: $(git rev-parse HEAD)"
            echo "xcode:  $(xcodebuild -version | head -n 1)"
            echo "ipa:    $NAME"
            echo "note:   未签名；含春风 5/6.2 寸 PXC 输出"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt
          ls -l dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-unsigned-ipa
          path: |
            dist/*.ipa
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: error
          retention-days: 30